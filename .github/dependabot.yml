version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend-python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Major frontend upgrades need a coordinated migration and UI verification.
    # In particular, vue-tsc 3.3.11 cannot use TypeScript 7's compiler exports.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      frontend-npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /steam-helper
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      steam-helper-npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
