name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Verify browser workflows
        run: npm run test:e2e

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Generate ephemeral development secrets
        run: python3 scripts/generate_env_secrets.py --output .env

      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose --env-file .env.production.example -f compose.production.yml config --quiet

      - name: Build application images
        run: docker compose build backend frontend gateway steam-helper

      - name: Run backend tests
        run: docker compose run --build --rm backend-tests

      - name: Verify Steam helper syntax
        run: docker compose run --rm --no-deps steam-helper npm run check

      - name: Verify production image
        run: |
          docker compose run --rm --no-deps backend python -c "import importlib.util; from pathlib import Path; import app.main; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('freezegun') is None; assert not Path('/app/tests').exists()"
          docker compose up -d backend
          docker compose exec -T backend python - <<'PY'
          import time
          import urllib.request

          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://localhost:8000/api/health', timeout=3) as response:
                      print(response.read().decode())
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          PY

      - name: Stop test stack
        if: always()
        run: docker compose --profile testing down --volumes --remove-orphans
