[project]
name = "lan-party-game-finder-backend"
version = "2.0.0"
description = "Local game-library matcher for LAN parties"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "rapidfuzz==3.14.6",
  "python-dateutil==2.9.0.post0",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.6",
  "legendary-gl==0.21.1",
  "PyYAML==6.0.3",
]

[dependency-groups]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "freezegun==1.5.5",
]

[tool.uv]
package = false
default-groups = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


