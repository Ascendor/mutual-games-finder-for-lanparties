[project]
name = "lan-party-game-finder-backend"
version = "2.0.0"
description = "Local game-library matcher for LAN parties"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "httpx==0.28.1",
  "rapidfuzz==3.14.6",
  "python-dateutil==3.0.0",
  "python-multipart==0.0.32",
  "psycopg[binary]==3.3.6",
  "legendary-gl==0.21.1",
  "PyYAML==6.0.3",
]

[dependency-groups]
test = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "freezegun==1.5.5",
]

[tool.uv]
package = false
default-groups = []
prerelease = "disallow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


