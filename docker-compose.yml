services:
  database:
    image: mirror.gcr.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lanparty}
      POSTGRES_USER: ${POSTGRES_USER:-lanparty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanparty}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lanparty} -d ${POSTGRES_DB:-lanparty}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  gateway:
    build: ./gateway
    depends_on:
      - frontend
      - backend
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-lanparty}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:-QC4lF93bYgwTHRT4xRynsAIz3San1lDW}
      LAN_UPLOAD_LIMIT: ${LAN_UPLOAD_LIMIT:-2g}
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - gateway-certs:/etc/nginx/certs

  backend:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lanparty}:${POSTGRES_PASSWORD:-lanparty}@database:5432/${POSTGRES_DB:-lanparty}
      SQLITE_MIGRATION_PATH: /legacy-data/lan_party_game_finder_migration_snapshot.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,https://localhost:8443,https://127.0.0.1:8443
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      PROVIDER_AUTH_ROOT: /provider-auth
    volumes:
      - backend-data:/legacy-data:ro
      - provider-auth:/provider-auth

  frontend:
    build: ./frontend
    depends_on:
      - backend

volumes:
  gateway-certs:
  backend-data:
  postgres-data:
  provider-auth:
