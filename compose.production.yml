name: refjuplay-together

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  database:
    image: mirror.gcr.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be configured}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be configured}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database-internal
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      steam-helper:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER must be configured}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@database:5432/${POSTGRES_DB:?POSTGRES_DB must be configured}
      CORS_ORIGINS: https://${APP_HOST:?APP_HOST must be configured}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be configured}
      UNOFFICIAL_PROVIDER_INTEGRATIONS_ENABLED: ${UNOFFICIAL_PROVIDER_INTEGRATIONS_ENABLED:-false}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      STEAM_HELPER_URL: http://steam-helper:3000
      STEAM_HELPER_TIMEOUT_SECONDS: ${STEAM_HELPER_TIMEOUT_SECONDS:-15}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      IMPORT_ARCHIVE_MAX_MEMBERS: ${IMPORT_ARCHIVE_MAX_MEMBERS:-25000}
      IMPORT_ARCHIVE_MAX_MEMBER_BYTES: ${IMPORT_ARCHIVE_MAX_MEMBER_BYTES:-2147483648}
      IMPORT_ARCHIVE_MAX_UNCOMPRESSED_BYTES: ${IMPORT_ARCHIVE_MAX_UNCOMPRESSED_BYTES:-6442450944}
      IMPORT_ARCHIVE_MAX_COMPRESSION_RATIO: ${IMPORT_ARCHIVE_MAX_COMPRESSION_RATIO:-500}
      XBOX_CLIENT_ID: ${XBOX_CLIENT_ID:-}
      PROVIDER_AUTH_ROOT: /provider-auth
      GOG_CLIENT_ID: ${GOG_CLIENT_ID:-46899977096215655}
      GOG_CLIENT_SECRET: ${GOG_CLIENT_SECRET:-9d85c43b1482497dbbce61f6e4aa173a433796eeae2ca8c5f6129f2dc4de46d9}
      GOG_AUTH_URL: ${GOG_AUTH_URL:-https://auth.gog.com/token}
      GOG_LOGIN_URL: ${GOG_LOGIN_URL:-https://auth.gog.com/auth}
      GOG_REDIRECT_URI: ${GOG_REDIRECT_URI:-https://embed.gog.com/on_login_success?origin=client}
      GOG_EMBED_URL: ${GOG_EMBED_URL:-https://embed.gog.com}
      GOG_API_URL: ${GOG_API_URL:-https://api.gog.com}
      EPIC_LOGIN_URL: ${EPIC_LOGIN_URL:-https://legendary.gl/epiclogin}
      UBISOFT_APP_ID: ${UBISOFT_APP_ID:-f68a4bb5-608a-4ff2-8123-be8ef797e0a6}
      UBISOFT_CLUB_GRAPHQL_URL: ${UBISOFT_CLUB_GRAPHQL_URL:-https://public-ubiservices.ubi.com/v1/profiles/me/uplay/graphql}
      AMAZON_DEVICE_TYPE: ${AMAZON_DEVICE_TYPE:-A2UMVHOX7UP4V7}
      AMAZON_LOGIN_URL: ${AMAZON_LOGIN_URL:-https://www.amazon.com/ap/signin}
      AMAZON_ENTITLEMENTS_URL: ${AMAZON_ENTITLEMENTS_URL:-https://gaming.amazon.com/api/distribution/entitlements}
      AMAZON_TOKEN_URL: ${AMAZON_TOKEN_URL:-https://api.amazon.com/auth/token}
      EA_GRAPHQL_URL: ${EA_GRAPHQL_URL:-https://service-aggregation-layer.juno.ea.com/graphql}
      EA_OWNED_GAMES_QUERY_HASH: ${EA_OWNED_GAMES_QUERY_HASH:-779f1cd1355699752e20c0b3877847f4e3010ef5de131c248e98f8eff84f0718}
      EA_PLAY_TIMES_QUERY_HASH: ${EA_PLAY_TIMES_QUERY_HASH:-3f09b35e06b75c74d8ec3e520a598ebb5e2992b1e1268b6dd3b8ed99b9fafb29}
      EA_IDENTITY_URL: ${EA_IDENTITY_URL:-https://gateway.ea.com/proxy/identity/pids/me}
      EA_ORIGIN_API_BASE_URLS: ${EA_ORIGIN_API_BASE_URLS:-https://api1.origin.com,https://api2.origin.com,https://api3.origin.com,https://api4.origin.com}
      META_GRAPHQL_URL: ${META_GRAPHQL_URL:-https://graph.oculus.com/graphql?locale=en_US}
      META_GRAPHQL_DOCUMENT_IDS: ${META_GRAPHQL_DOCUMENT_IDS:-9431935310238631,29383114651302983,29143116735333849}
      TMPDIR: /playnite-uploads
      PLAYNITE_UPLOAD_DIR: /playnite-uploads
      PLAYNITE_UPLOAD_MAX_BYTES: ${PLAYNITE_UPLOAD_MAX_BYTES:-4294967296}
      GAMES_OPTIONS_CACHE_SECONDS: ${GAMES_OPTIONS_CACHE_SECONDS:-300}
      GAMES_OPTIONS_STALE_SECONDS: ${GAMES_OPTIONS_STALE_SECONDS:-60}
      RECOMMENDATION_HTTP_CACHE_SECONDS: ${RECOMMENDATION_HTTP_CACHE_SECONDS:-30}
      RECOMMENDATION_CACHE_ENTRY_TTL_SECONDS: ${RECOMMENDATION_CACHE_ENTRY_TTL_SECONDS:-3600}
      RECOMMENDATION_CACHE_MAX_ENTRIES: ${RECOMMENDATION_CACHE_MAX_ENTRIES:-64}
      RECOMMENDATION_COMMON_MINIMUM_COVERAGE_DEFAULT: ${RECOMMENDATION_COMMON_MINIMUM_COVERAGE_DEFAULT:-75}
      RECOMMENDATION_OPTIONAL_UNSYNCED_PLATFORMS: ${RECOMMENDATION_OPTIONAL_UNSYNCED_PLATFORMS:-ea}
      RECOMMENDATION_PLAYTIME_CAP_MINUTES: ${RECOMMENDATION_PLAYTIME_CAP_MINUTES:-20000}
      RECOMMENDATION_MEDIAN_PLAYTIME_CAP_MINUTES: ${RECOMMENDATION_MEDIAN_PLAYTIME_CAP_MINUTES:-5000}
      RECOMMENDATION_PLAYTIME_DIVISOR: ${RECOMMENDATION_PLAYTIME_DIVISOR:-100}
      RECOMMENDATION_MEDIAN_PLAYTIME_DIVISOR: ${RECOMMENDATION_MEDIAN_PLAYTIME_DIVISOR:-100}
      RECOMMENDATION_CAPACITY_FIT_BONUS: ${RECOMMENDATION_CAPACITY_FIT_BONUS:-300}
      RECOMMENDATION_COMMON_ADOPTION_WEIGHT: ${RECOMMENDATION_COMMON_ADOPTION_WEIGHT:-1000}
      RECOMMENDATION_COMMON_MEDIAN_WEIGHT: ${RECOMMENDATION_COMMON_MEDIAN_WEIGHT:-2}
      RECOMMENDATION_COMMON_MULTIPLAYER_BONUS: ${RECOMMENDATION_COMMON_MULTIPLAYER_BONUS:-150}
      RECOMMENDATION_COOP_ADOPTION_WEIGHT: ${RECOMMENDATION_COOP_ADOPTION_WEIGHT:-1000}
      RECOMMENDATION_COOP_ONLINE_BONUS: ${RECOMMENDATION_COOP_ONLINE_BONUS:-500}
      RECOMMENDATION_COOP_LOCAL_BONUS: ${RECOMMENDATION_COOP_LOCAL_BONUS:-250}
      RECOMMENDATION_COOP_SCREEN_BONUS: ${RECOMMENDATION_COOP_SCREEN_BONUS:-100}
      RECOMMENDATION_LAN_OWNER_WEIGHT: ${RECOMMENDATION_LAN_OWNER_WEIGHT:-1200}
      RECOMMENDATION_LAN_BONUS: ${RECOMMENDATION_LAN_BONUS:-300}
      RECOMMENDATION_GROUP_OWNER_WEIGHT: ${RECOMMENDATION_GROUP_OWNER_WEIGHT:-1000}
      RECOMMENDATION_GROUP_MULTIPLAYER_BONUS: ${RECOMMENDATION_GROUP_MULTIPLAYER_BONUS:-150}
      RECOMMENDATION_NEW_OWNER_WEIGHT: ${RECOMMENDATION_NEW_OWNER_WEIGHT:-1500}
      RECOMMENDATION_NEW_FRESHNESS_BASE_MINUTES: ${RECOMMENDATION_NEW_FRESHNESS_BASE_MINUTES:-5000}
      RECOMMENDATION_NEW_FRESHNESS_DIVISOR: ${RECOMMENDATION_NEW_FRESHNESS_DIVISOR:-10}
      RECOMMENDATION_NEW_PLAYTIME_PENALTY_DIVISOR: ${RECOMMENDATION_NEW_PLAYTIME_PENALTY_DIVISOR:-200}
      RECOMMENDATION_POPULAR_ADOPTION_WEIGHT: ${RECOMMENDATION_POPULAR_ADOPTION_WEIGHT:-5000}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-180}
      PRIVACY_CONTROLLER_NAME: ${PRIVACY_CONTROLLER_NAME:-Betreiber:in dieser Installation}
      PRIVACY_CONTROLLER_CONTACT: ${PRIVACY_CONTROLLER_CONTACT:-Kontakt über den internen LAN-Party-Gruppenkanal}
      PRIVACY_HOSTING_PROVIDER: ${PRIVACY_HOSTING_PROVIDER:-VServer-Hostinganbieter der Betreiberperson}
      PRIVACY_ACCESS_LOG_RETENTION_DAYS: ${PRIVACY_ACCESS_LOG_RETENTION_DAYS:-7}
      PRIVACY_BACKUP_RETENTION_DAYS: ${PRIVACY_BACKUP_RETENTION_DAYS:-14}
      PRIVACY_SUPERVISORY_AUTHORITY: ${PRIVACY_SUPERVISORY_AUTHORITY:-Zuständige Landesdatenschutzaufsichtsbehörde}
      PRIVACY_SUPERVISORY_AUTHORITY_URL: ${PRIVACY_SUPERVISORY_AUTHORITY_URL:-https://www.datenschutzkonferenz-online.de/datenschutzaufsichtsbehoerden.html}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18000}:8000"
    volumes:
      - provider-auth:/provider-auth
      - playnite-uploads:/playnite-uploads
    networks:
      - application
      - database-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-18080}:80"
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  steam-helper:
    build:
      context: .
      dockerfile: steam-helper/Dockerfile
    restart: unless-stopped
    networks:
      - application
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

networks:
  application:
  database-internal:
    internal: true

volumes:
  postgres-data:
  provider-auth:
  playnite-uploads:
